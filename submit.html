<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tensor Recruitment</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Roboto',sans-serif;
}

body{
    background:#eef4fb;
    padding:40px 15px;
}

.container{
    max-width:720px;
    margin:auto;
}

.banner{

    background:#fff;
    border:1px solid #dadce0;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:25px;

}

.banner img{

    width:100%;
    display:block;

}

.card{

    background:#fff;
    border:1px solid #dadce0;
    border-radius:12px;
    overflow:hidden;

}

.top{

    height:12px;
    background:#90caf9;

}

.content{

    padding:55px;

}

h1{

    font-size:58px;
    font-weight:300;
    color:#202124;
    margin-bottom:35px;

}

.message{

    font-size:22px;
    color:#3c4043;
    line-height:1.7;

}

.message p{

    margin-bottom:18px;

}

.note{

    margin-top:35px;
    color:#5f6368;
    font-size:18px;

}

.button{

    margin-top:45px;

}

.button a{

    display:inline-block;
    text-decoration:none;
    background:#1a73e8;
    color:white;
    padding:14px 34px;
    border-radius:4px;
    font-size:18px;

}

.button a:hover{

    background:#1558b0;

}

.footer{

    text-align:center;
    margin-top:45px;
    color:#70757a;
    font-size:15px;

}

@media(max-width:768px){

.content{

padding:35px;

}

h1{

font-size:42px;

}

.message{

font-size:19px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="banner">

<img src="tensor-banner.png" alt="Tensor Banner">

</div>

<div class="card">

<div class="top"></div>

<div class="content">

<h1>Recruitment Form</h1>

<div class="message">

<p>Your response has been recorded.</p>

<p>Thank you for submitting the form <strong>Tensor Club</strong>.</p>



</div>

<div class="note">

Thank you for taking the time to complete the application.

</div>

<div class="button">

<a href="index.html">Submit another response</a>

</div>

</div>

</div>

<div class="footer">

Tensor Club • Beyond Dimensions

</div>

</div>

</body>
</html>
