<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<div class="container">
    <div class="banner" aria-label="Banner area for an image">
        <img src="banner.jpg" alt="banner image">
    </div>

    <div class="header"></div>

    <div class="form-card">
        <h1>Registration Form</h1>
        <p>Please fill out the following information accurately.</p>

      <form id="registrationForm">

            <label for="name">Full Name <span>*</span></label>
            <input type="text" id="name" name="fullname" placeholder="Enter your full name" required>
            <label for="faculty">Faculty <span>*</span></label>
            <select id="faculty" name="faculty" required>
                <option value="">Select Faculty</option>
                <option>Computer Engineering</option>
                <option>Civil Engineering</option>
                <option>Electronics & Communication Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Automobile Engineering</option>
               
            </select>

            <label for="year">Year <span>*</span></label>
            <select id="year" name="year" required>
                <option value="">Select Year</option>
                <option>First Year</option>
                <option>Second Year</option>
                <option>Third Year</option>
                <option>Fourth Year</option>
                <option>Fifth Year</option>
            </select>

            <label for="email">Email Address <span>*</span></label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="College Name">College Name <span>*</span></label>
            <input type="text" id="college" name="college" placeholder="Enter your College Name" required>


            <label for="phone">Phone Number <span>*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="98XXXXXXXX" pattern="[0-9]{10}" required>

            <label for="role">Preferred Role <span>*</span></label>
            <select id="role" name="preferredRole" required>
                <option value="">Select a role</option>
                <option>Technical Team</option>
                <option>Design Team</option>
                <option>Content and Social Media</option>
                <option>Event Management</option>
                <option>Public Relations</option>
            </select>

            <label for="skills">Skills and Tools</label>
            <input type="text" id="skills" name="skills" placeholder="e.g. Python, Figma, public speaking">

            <label for="experience">Relevant Experience</label>
            <textarea id="experience" name="experience" rows="4" placeholder="Tell us about projects, clubs, or activities you have worked on."></textarea>

            <label>Weekly Availability <span>*</span></label>
            <div class="option-group">
                <label class="option"><input type="radio" name="availability" value="1-3 hours" required> 1-3 hours</label>
                <label class="option"><input type="radio" name="availability" value="4-6 hours"> 4-6 hours</label>
                <label class="option"><input type="radio" name="availability" value="7+ hours"> 7+ hours</label>
            </div>

            <label for="portfolio">  LinkedIn Link</label>
            <input type="url" id="portfolio" name="portfolio" placeholder="https://">

            <label for="github">GitHub Link</label>
            <input type="url" id="github" name="github" placeholder="https://github.com/username">

            <label for="source">How did you hear about this event? <span>*</span></label>
            <select id="source" name="referralSource" required>
                <option value="">Select an option</option>
                <option>Social media</option>
                <option>Friend or classmate</option>
                <option>College announcement</option>
                <option>Club member</option>
                <option>Other</option>
            </select>

            <label for="motivation">Why would you like to join? <span>*</span></label>
            <textarea id="motivation" name="motivation" rows="5" placeholder="Share a few sentences about your interest." required></textarea>

            <label class="option consent"><input type="checkbox" name="consent" value="Yes" required> I confirm that the information provided is accurate and i incorrect information will proceed to form rejection..</label>


            <button type="submit">Submit</button>

        </form>
    </div>
</div>
<script src="submit.js"></script>
</body>
</html>
